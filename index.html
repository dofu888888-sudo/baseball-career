<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣職棒球員人生模擬器 v0.1.2</title>
<style>
body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:860px;margin:auto;padding:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.hidden{display:none!important}label{display:block;color:#cbd5e1}input,select{width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;font-size:16px}button{border:0;border-radius:10px;padding:12px 14px;margin:5px 4px 5px 0;background:#2563eb;color:white;font-weight:700;font-size:15px}button.alt{background:#475569}button:disabled{opacity:.4}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #334155;padding:6px 0}.ok{color:#4ade80}.bad{color:#fb7185}.muted{color:#94a3b8}.log{white-space:pre-wrap;background:#020617;border-radius:10px;padding:12px;max-height:280px;overflow:auto}.big{font-size:20px;font-weight:800}
</style>
</head>
<body>
<main>
<h1>⚾ 台灣職棒球員人生模擬器 <span class="muted">v0.1.2</span></h1>
<div id="jsWarning" class="card"><b class="bad">啟動檢查：</b>如果這行一直顯示，代表目前的檔案預覽器禁止執行 JavaScript。請用真正的瀏覽器開啟。</div>
<div id="jsReady" class="card hidden"><b class="ok">✓ 遊戲引擎已載入</b></div>
<div id="errorBox" class="card hidden"><b class="bad">錯誤：</b><span id="errorText"></span></div>

<section id="setup" class="card">
<h2>建立投手</h2>
<div class="row">
<label>姓名<input id="name" value="Leo Tsai"></label>
<label>投球慣用手<select id="hand"><option value="右投">右投</option><option value="左投">左投</option></select></label>
<label>投手原型<select id="archetype"><option value="power">火球型</option><option value="control">控球型</option><option value="breaking">變化球型</option><option value="workhorse">工作馬型</option></select></label>
</div>
<button type="button" onclick="startGame();return false;">開始生涯</button>
</section>

<section id="game" class="hidden">
<div class="card"><div class="row"><div><span class="muted">球員</span><div id="pName" class="big"></div></div><div><span class="muted">球隊</span><div id="pTeam" class="big"></div></div><div><span class="muted">年齡 / 年份</span><div id="pAgeYear" class="big"></div></div><div><span class="muted">角色</span><div id="role" class="big"></div></div></div></div>
<div class="row"><div class="card"><h3>基礎能力</h3><div id="baseStats"></div></div><div class="card"><h3>球種</h3><div id="pitchStats"></div></div></div>
<div class="card"><h2>訓練</h2><div>剩餘訓練點：<b id="tp" class="ok"></b></div><div id="trainingButtons"></div></div>
<div class="card"><h2>球季</h2><div class="row"><div><span class="muted">戰績</span><div id="record" class="big"></div></div><div><span class="muted">個人成績</span><div id="seasonLine"></div></div><div><span class="muted">疲勞</span><div id="fatigue" class="big"></div></div></div><p><button onclick="simulateGames(1)">模擬 1 場</button><button onclick="simulateGames(5)">模擬 5 場</button><button onclick="simulateGames(20)">模擬約 1 個月</button><button class="alt" onclick="restWeek()">休息一週</button></p></div>
<div id="clutch" class="card hidden"><h2>🔥 CLUTCH MOMENT</h2><div id="clutchText"></div><button onclick="resolveClutch('high')">HIGH FASTBALL</button><button onclick="resolveClutch('challenge')">CHALLENGE</button><button onclick="resolveClutch('chase')">CHASE PITCH</button></div>
<div class="card"><h2>聯盟排名</h2><div id="standings"></div></div>
<div class="card"><h2>生涯 / 新聞紀錄</h2><div id="log" class="log"></div></div>
</section>
</main>
<script>
(function(){
var teams=[
{name:'臺北騎士',strength:54},{name:'新北紅龍',strength:53},{name:'桃園猴子',strength:53},{name:'臺中大象',strength:54},{name:'高雄老鷹',strength:51},{name:'臺南獅子',strength:53}
];
var state=null;
function el(id){return document.getElementById(id)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clamp(v,a,b){if(a===undefined)a=0;if(b===undefined)b=100;return Math.max(a,Math.min(b,v))}
function label(k){var m={control:'控球',movement:'變化',stuff:'球威',stamina:'體力',durability:'韌性',defense:'守備',veloMax:'球速'};return m[k]||k}
function safe(fn){try{fn()}catch(err){el('errorText').innerHTML=String(err&&err.message?err.message:err);el('errorBox').className='card';}}
function archetypeStats(type){var b={control:55,movement:55,stuff:60,stamina:60,durability:60,defense:50,veloMax:149};if(type==='power'){b.control=48;b.movement=52;b.stuff=74;b.veloMax=153}else if(type==='control'){b.control=72;b.movement=58;b.stuff=56;b.stamina=62;b.veloMax=147}else if(type==='breaking'){b.control=58;b.movement=74;b.stuff=60;b.stamina=58;b.durability=57;b.veloMax=148}else if(type==='workhorse'){b.control=60;b.movement=56;b.stuff=59;b.stamina=78;b.durability=78;b.veloMax=148}return b}
function role(){var a=state.attrs,s=(a.control+a.movement+a.stuff+a.stamina)/4;if(s>=75)return'一軍先發';if(s>=68)return'一軍牛棚';if(s>=60)return'一軍/二軍間';return'二軍培養'}
function addLog(s){state.log.push(s)}
function era(){return state.season.ip?((state.season.er*9)/state.season.ip).toFixed(2):'0.00'}
function summary(){return state.season.g+'G / '+state.season.gs+'GS / '+state.season.w+'-'+state.season.l+' / ERA '+era()+' / '+state.season.k+' K'}
window.startGame=function(){safe(function(){var type=el('archetype').value,a=archetypeStats(type),t=teams[rnd(0,teams.length-1)];state={year:2027,age:18,name:el('name').value||'Rookie',hand:el('hand').value,team:t.name,attrs:a,training:6,fatigue:0,games:0,teamW:0,teamL:0,season:{g:0,gs:0,w:0,l:0,ip:0,er:0,k:0,bb:0,h:0},pitches:{'四縫線':{control:clamp(a.control+rnd(-5,5)),stuff:clamp(a.stuff+rnd(-4,6)),movement:null,velo:a.veloMax-rnd(2,5)},'滑球':{control:rnd(45,65),stuff:rnd(50,70),movement:type==='breaking'?rnd(68,80):rnd(50,68),velo:a.veloMax-rnd(10,15)},'變速球':{control:rnd(40,60),stuff:rnd(45,65),movement:rnd(48,70),velo:a.veloMax-rnd(15,22)}},league:[],log:[],pendingClutch:null};for(var i=0;i<teams.length;i++){state.league.push({name:teams[i].name,w:0,l:0,strength:teams[i].strength+rnd(-3,3)})}addLog('2027 選秀會：'+state.team+'選中了 '+state.name+'。職棒生涯正式開始。');el('setup').className='card hidden';el('game').className='';render();})}
window.train=function(k){safe(function(){if(!state||state.training<=0)return;state.training--;var gain=Math.random()<0.75?rnd(1,2):0;if(k==='veloMax'){if(Math.random()<0.4){state.attrs.veloMax++;state.pitches['四縫線'].velo++;gain=1}else gain=0}else state.attrs[k]=clamp(state.attrs[k]+gain);state.fatigue=clamp(state.fatigue+rnd(2,5));addLog(label(k)+'訓練'+(gain?' +'+gain:'，無明顯提升')+'。');render()})}
window.trainPitch=function(n,k){safe(function(){if(!state||state.training<=0)return;var p=state.pitches[n];if(!p||p[k]===null)return;state.training--;var g=Math.random()<0.75?rnd(1,2):0;p[k]=clamp(p[k]+g);state.fatigue=clamp(state.fatigue+rnd(1,4));addLog(n+label(k)+'訓練'+(g?' +'+g:'，無明顯提升')+'。');render()})}
window.simulateGames=function(n){safe(function(){if(!state||state.pendingClutch)return;for(var i=0;i<n;i++){if(state.games>=120){endSeason();break}simulateOne();if(state.pendingClutch)break}render()})}
function simulateOne(){state.games++;var mine=null,others=[];for(var i=0;i<state.league.length;i++){if(state.league[i].name===state.team)mine=state.league[i];else others.push(state.league[i])}var opp=others[rnd(0,others.length-1)],a=state.attrs,pen=Math.max(0,(state.fatigue-40)*0.18),pit=(a.control+a.movement+a.stuff+a.stamina)/4-pen,rl=role(),impact=0;if(rl==='一軍先發'){state.season.g++;state.season.gs++;var ip=Math.max(3,Math.min(8,(a.stamina/15)+Math.random()*2-pen/10));ip=Math.round(ip*10)/10;var eb=Math.max(1.6,5.6-(pit-50)*0.055),er=Math.max(0,Math.round((eb/9)*ip+(Math.random()-.5)*2)),k=Math.max(0,Math.round(ip*(.7+(a.movement+a.stuff)/220)+rnd(-2,2)));state.season.ip+=ip;state.season.er+=er;state.season.k+=k;if(Math.random()<.52){if(er<=3){state.season.w++;impact=2}else{state.season.l++;impact=-1}}state.fatigue=clamp(state.fatigue+rnd(10,18)-Math.floor(a.durability/20))}else if(rl!=='二軍培養'&&Math.random()<.65){state.season.g++;state.season.ip+=1;var rer=Math.random()<pit/120?0:rnd(0,2);state.season.er+=rer;state.season.k+=rnd(0,2);state.fatigue=clamp(state.fatigue+rnd(4,9)-Math.floor(a.durability/25))}else state.fatigue=clamp(state.fatigue-rnd(1,4));var ms=rnd(0,6)+impact+Math.round(mine.strength/18),os=rnd(0,6)+Math.round(opp.strength/18);if(ms>os){mine.w++;opp.l++;state.teamW++}else{mine.l++;opp.w++;state.teamL++}if(rl!=='二軍培養'&&state.games>5&&Math.random()<.07&&Math.abs(ms-os)<=2){state.pendingClutch={opp:opp.name,score:ms+':'+os,inning:rnd(7,9),outs:rnd(0,2),runner:['二壘','一、三壘','滿壘'][rnd(0,2)]};el('clutch').className='card'}if(state.games%20===0)addLog('球季進行到第 '+state.games+' 場，你目前 '+state.teamW+'-'+state.teamL+'。')}
window.resolveClutch=function(c){safe(function(){if(!state||!state.pendingClutch)return;var a=state.attrs,s=0,d='';if(c==='high'){s=a.stuff*.45+a.control*.25+(a.veloMax-140)*1.5;d='高角度速球'}else if(c==='challenge'){s=a.stuff*.38+a.control*.38+(a.veloMax-140);d='直球對決'}else{s=a.movement*.55+a.control*.28;d='引誘球'}s-=Math.max(0,state.fatigue-60)*.35;var rr=rnd(1,100);if(rr<Math.min(82,s)){state.season.k++;addLog('🔥 關鍵時刻：你選擇'+d+'，STRIKE THREE！')}else if(rr<Math.min(94,s+15)){addLog('🔥 關鍵時刻：你選擇'+d+'，製造出局。')}else{state.season.er+=rnd(1,3);addLog('💥 關鍵時刻：你選擇'+d+'，失投遭到長打。')}state.pendingClutch=null;el('clutch').className='card hidden';render()})}
window.restWeek=function(){safe(function(){if(!state)return;state.fatigue=clamp(state.fatigue-rnd(15,28));addLog('休息一週，疲勞下降。');render()})}
function endSeason(){addLog('🏁 '+state.year+' 球季結束。'+summary());state.year++;state.age++;state.games=0;state.teamW=0;state.teamL=0;state.training=6;state.fatigue=Math.max(0,state.fatigue-45);state.season={g:0,gs:0,w:0,l:0,ip:0,er:0,k:0,bb:0,h:0};for(var i=0;i<state.league.length;i++){state.league[i].w=0;state.league[i].l=0}addLog('📅 '+state.year+' 球季開始，你現在 '+state.age+' 歲。')}
function render(){if(!state)return;el('pName').innerHTML=state.name+'｜'+state.hand;el('pTeam').innerHTML=state.team;el('pAgeYear').innerHTML=state.age+'歲｜'+state.year;el('role').innerHTML=role();el('tp').innerHTML=state.training;el('record').innerHTML=state.teamW+'-'+state.teamL+'（'+state.games+'/120）';el('seasonLine').innerHTML=summary();el('fatigue').innerHTML=state.fatigue+'%';var ks=['control','movement','stuff','stamina','durability','defense'],h='';for(var i=0;i<ks.length;i++)h+='<div class="stat"><span>'+label(ks[i])+'</span><b>'+state.attrs[ks[i]]+'</b></div>';h+='<div class="stat"><span>最快球速</span><b>'+state.attrs.veloMax+' km/h</b></div>';el('baseStats').innerHTML=h;h='';for(var n in state.pitches){var p=state.pitches[n];h+='<p><b>'+n+'</b><br><span class="muted">控球 '+p.control+'｜球威 '+p.stuff+(p.movement===null?'':'｜變化 '+p.movement)+'｜'+p.velo+' km/h</span></p>'}el('pitchStats').innerHTML=h;h='';for(i=0;i<ks.length;i++)h+='<button onclick="train(\''+ks[i]+'\')" '+(state.training<=0?'disabled':'')+'>'+label(ks[i])+'訓練</button>';h+='<button onclick="train(\'veloMax\')" '+(state.training<=0?'disabled':'')+'>球速訓練</button><hr>';for(n in state.pitches){p=state.pitches[n];h+='<b>'+n+'</b>：<button class="alt" onclick="trainPitch(\''+n+'\',\'control\')">控球</button><button class="alt" onclick="trainPitch(\''+n+'\',\'stuff\')">球威</button>'+(p.movement===null?'':'<button class="alt" onclick="trainPitch(\''+n+'\',\'movement\')">變化</button>')+'<br>'}el('trainingButtons').innerHTML=h;var sorted=state.league.slice().sort(function(a,b){return b.w-a.w});h='';for(i=0;i<sorted.length;i++)h+='<div class="stat"><span>'+(i+1)+'. '+sorted[i].name+'</span><b>'+sorted[i].w+'-'+sorted[i].l+'</b></div>';el('standings').innerHTML=h;el('log').innerHTML=state.log.slice().reverse().join('\n');if(state.pendingClutch){var c=state.pendingClutch;el('clutchText').innerHTML='<p><b>'+state.team+' vs '+c.opp+'</b></p><p>'+c.inning+'局｜'+c.outs+'出局｜'+c.runner+'有人｜比分 '+c.score+'</p>'}}
window.onerror=function(msg){el('errorText').innerHTML=String(msg);el('errorBox').className='card'};
el('jsWarning').className='card hidden';el('jsReady').className='card';
})();
</script>
</body></html>
